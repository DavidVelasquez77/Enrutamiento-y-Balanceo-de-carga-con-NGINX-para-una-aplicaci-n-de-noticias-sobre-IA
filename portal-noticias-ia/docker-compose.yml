services:

  app1:
    build:
      context: ./app
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      INSTANCE_NAME: APP-1

    expose:
      - "3000"

    networks:
      - portal-network

    restart: unless-stopped


  app2:
    build:
      context: ./app
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      INSTANCE_NAME: APP-2

    expose:
      - "3000"

    networks:
      - portal-network

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app1
      - app2

    networks:
      - portal-network

    restart: unless-stopped


networks:

  portal-network:
    driver: bridge