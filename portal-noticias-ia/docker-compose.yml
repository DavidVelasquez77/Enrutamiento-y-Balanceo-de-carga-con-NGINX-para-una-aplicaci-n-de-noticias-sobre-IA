services:

  app1:
    build:
      context: ./app
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      INSTANCE_NAME: APP-1

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - portal-network

    restart: unless-stopped


  app2:
    build:
      context: ./app
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      INSTANCE_NAME: APP-2

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - portal-network

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app1:
        condition: service_healthy

      app2:
        condition: service_healthy

    networks:
      - portal-network

    restart: unless-stopped


networks:

  portal-network:
    driver: bridge